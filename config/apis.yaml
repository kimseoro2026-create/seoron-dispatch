# 디지털융합플랫폼 API 호출 설정
# ─────────────────────────────────────────────────────────────
# 각 API의 'url'과 요청변수 이름은 플랫폼 상세 화면(호출 URL, 요청변수 표)을 보고 채운다.
# 인증키는 .env의 KOREACONNECT_API_USER_KEY_ID에 넣는다. 헤더 이름은 플랫폼 화면에서 확인한 값(api_user_key_id)이 기본값이며,
# API별로 다르면 해당 항목에 key_header를 따로 적는다.
# {중괄호} 값은 코드가 채운다.

key_header: "api_user_key_id"
timeout_sec: 40
retries: 5
retry_backoff_sec: 10   # 10 → 20 → 40 → 80 → 160초 간격
page_delay_sec: 5       # 페이지 사이 기본 지연 (3 → 5초로 늘림)

hospitals:               # 건강보험심사평가원_병원정보서비스_병원기본목록
  # 2026-11-07 플랫폼 상세 화면에서 확인한 값. 응답 형식은 XML.
  url: "https://api.koreaconnect.kr/01/1/2603101713597416530PDP/HEALTH/B551182/hospInfoServicev2/getHospBasisList"
  method: "GET"
  params:
    pageNo: "{page}"
    numOfRows: 500       # 한 페이지 결과 수. 500으로 요청해 페이지 수를 줄인다
    xPos: "{lon}"        # x좌표(소수점 15) — 중심 경도
    yPos: "{lat}"        # y좌표(소수점 15) — 중심 위도
    radius: "{radius}"   # 단위: 미터(m)
  # 응답 항목 → 표준 열 이름 (화면의 출력결과 항목명과 일치)
  field_map:
    hospital_id: "ykiho"     # 암호화된 요양기호
    name: "yadmNm"           # 병원명
    class_name: "clCdNm"     # 종별코드명
    address: "addr"          # 주소
    lon: "XPos"              # x좌표
    lat: "YPos"              # y좌표
  total_count_field: "totalCount"

population:              # 행정안전부_행정동별(통반단위) 성/연령별 주민등록 인구수
  # 2026-11-14 플랫폼 상세 화면에서 확인한 값. 응답은 XML(기본값)로 받아 resultCode 를 확인한다.
  url: "https://api.koreaconnect.kr/01/1/2603101713597416530PDP/DEMRES/1741000/admmSexdAgePpltn/selectAdmmSexdAgePpltn"
  method: "GET"
  params:
    admmCd: "{admmCd}"     # 행정기관코드(10자리)
    srchFrYm: "{ym}"       # 조회 시작년월(YYYYMM, 2022.10부터)
    srchToYm: "{ym}"       # 조회 종료년월(3개월 이내)
    lv: "{lv}"             # 1 시도, 2 시군구, 3 읍면동, 4 읍면동 통반(기본)
    regSeCd: "1"           # 등록구분: 1 전체
    numOfRows: 100         # 최대 100
    pageNo: "{page}"
  field_map:
    dong: "dongNm"         # 행정동명
    admm_cd: "admmCd"      # 행정기관코드
    sgg: "sggNm"           # 시군구명
    stats_ym: "statsYm"    # 통계년월
    # 연령이 10세 구간이라 '65세 이상'은 정확히 나눌 수 없다 → 70세 이상을 합산하고 60~69세는 따로 둔다
    age_70_plus_fields: ["male70AgeNmprCnt", "male80AgeNmprCnt", "male90AgeNmprCnt", "male100AgeNmprCnt",
                         "feml70AgeNmprCnt", "feml80AgeNmprCnt", "feml90AgeNmprCnt", "feml100AgeNmprCnt"]
    age_60s_fields: ["male60AgeNmprCnt", "feml60AgeNmprCnt"]
    total: "totNmprCnt"
  total_count_field: "totalCount"

weather:                 # 기상청_단기예보 조회서비스_단기예보조회
  url: "TODO: 상세 화면의 호출 URL"
  method: "GET"
  params:
    pageNo: 1
    numOfRows: 1000
    dataType: "JSON"
    base_date: "{base_date}"
    base_time: "{base_time}"
    nx: "{nx}"
    ny: "{ny}"

transit:                 # 대중교통 길찾기 (ODsay)
  url: "TODO: 상세 화면의 호출 URL"
  method: "GET"
  params:
    SX: "{sx}"           # 출발 경도
    SY: "{sy}"           # 출발 위도
    EX: "{ex}"           # 도착 경도
    EY: "{ey}"           # 도착 위도
