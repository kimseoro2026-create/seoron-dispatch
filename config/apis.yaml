# 디지털융합플랫폼 API 호출 설정
# ─────────────────────────────────────────────────────────────
# 각 API의 'url'과 요청변수 이름은 플랫폼 상세 화면(호출 URL, 요청변수 표)을 보고 채운다.
# 인증키는 .env의 KOREACONNECT_API_USER_KEY_ID에 넣는다. 헤더 이름은 플랫폼 화면에서 확인한 값(api_user_key_id)이 기본값이며,
# API별로 다르면 해당 항목에 key_header를 따로 적는다.
# {중괄호} 값은 코드가 채운다.

key_header: "api_user_key_id"
timeout_sec: 40
retries: 5
retry_backoff_sec: 10   # 10 → 20 → 40 → 80 → 160초 간격
page_delay_sec: 5       # 페이지 사이 기본 지연 (3 → 5초로 늘림)

hospitals:               # 건강보험심사평가원_병원정보서비스_병원기본목록
  # 2026-11-07 플랫폼 상세 화면에서 확인한 값. 응답 형식은 XML.
  url: "https://api.koreaconnect.kr/01/1/2603101713597416530PDP/HEALTH/B551182/hospInfoServicev2/getHospBasisList"
  method: "GET"
  params:
    pageNo: "{page}"
    numOfRows: 500       # 한 페이지 결과 수. 500으로 요청해 페이지 수를 줄인다
    xPos: "{lon}"        # x좌표(소수점 15) — 중심 경도
    yPos: "{lat}"        # y좌표(소수점 15) — 중심 위도
    radius: "{radius}"   # 단위: 미터(m)
  # 응답 항목 → 표준 열 이름 (화면의 출력결과 항목명과 일치)
  field_map:
    hospital_id: "ykiho"     # 암호화된 요양기호
    name: "yadmNm"           # 병원명
    class_name: "clCdNm"     # 종별코드명
    address: "addr"          # 주소
    lon: "XPos"              # x좌표
    lat: "YPos"              # y좌표
  total_count_field: "totalCount"

population:              # 행정안전부_행정동별(통반단위) 성/연령별 주민등록 인구수
  url: "TODO: 상세 화면의 호출 URL"
  method: "GET"
  params:
    pageNo: "{page}"
    numOfRows: 1000
    # TODO: 상세 화면의 요청변수(예: 행정기관코드, 조회 기준월)를 그대로 적는다
  field_map:
    dong: "TODO: 행정동명 항목"
    # 65세 이상 연령 구간 항목들을 모두 적으면 합산한다
    age_65_plus_fields: ["TODO: 65~69세 항목", "TODO: 70~74세 항목"]
  total_count_field: "totalCount"

weather:                 # 기상청_단기예보 조회서비스_단기예보조회
  url: "TODO: 상세 화면의 호출 URL"
  method: "GET"
  params:
    pageNo: 1
    numOfRows: 1000
    dataType: "JSON"
    base_date: "{base_date}"
    base_time: "{base_time}"
    nx: "{nx}"
    ny: "{ny}"

transit:                 # 대중교통 길찾기 (ODsay)
  url: "TODO: 상세 화면의 호출 URL"
  method: "GET"
  params:
    SX: "{sx}"           # 출발 경도
    SY: "{sy}"           # 출발 위도
    EX: "{ex}"           # 도착 경도
    EY: "{ey}"           # 도착 위도
